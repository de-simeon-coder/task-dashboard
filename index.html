<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <button id="themeToggleBtn" class="purple-btn">Toggle Dark Mode</button>

        <h1>Welcome!</h1>
        <p class="section-desc">Enter your name to save it locally:</p>

        <div class="name-section">
            <input type="text" id="nameInput" placeholder="Type your name here...">
            <button id="saveNameBtn" class="green-btn">Save Name</button>
            <p id="greetingText" class="greeting hidden"></p>
        </div>

        <hr class="divider">

        <h2 id="completedCount">Completed Tasks: 0</h2>
        <div class="progress-bar-container">
            <div id="progressBar" class="progress-bar"></div>
        </div>

        <div class="task-form">
            <input type="text" id="taskInput" placeholder="Add a new task...">
            
            <div class="select-group">
                <select id="categorySelect">
                    <option value="Study">Study</option>
                    <option value="Work">Work</option>
                    <option value="Personal">Personal</option>
                </select>
                <select id="prioritySelect">
                    <option value="Low Priority">Low Priority</option>
                    <option value="Medium Priority">Medium Priority</option>
                    <option value="High Priority">High Priority</option>
                </select>
            </div>

            <input type="date" id="dueDateInput" class="date-input">

            <button id="addTaskBtn" class="blue-btn">Add Task</button>
        </div>

        <div class="filter-group">
            <button class="filter-btn active" data-filter="all">All</button>
            <button class="filter-btn" data-filter="active">Active</button>
            <button class="filter-btn" data-filter="completed">Completed</button>
        </div>

        <ul id="taskList"></ul>

        <div class="backup-group">
            <button id="exportJsonBtn" class="gray-btn">Export JSON</button>
            <button id="exportCsvBtn" class="gray-btn">Export CSV</button>
            <label for="importFile" class="gray-btn file-label">Import Data</label>
            <input type="file" id="importFile" accept=".json" class="hidden-input">
        </div>

        <button id="resetDataBtn" class="orange-btn">Reset All Data</button>
    </div>
    <script src="script.js"></script>
</body>
</html>
